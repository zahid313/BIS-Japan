<!-- NOTE SHEET: explains the ※ / * marks without sending people down the page -->
  <dialog class="sheet" id="ast-sheet" aria-labelledby="ast-title">
    <h2 id="ast-title" data-en="About the * note">※ について</h2>
    <p data-en="The subsidy needs your municipality’s childcare-need certification and other conditions, and the school bus is a separate actual-cost fee. Ask us during a visit and we’ll check what applies to your family.">無償化の適用には、お住まいの自治体による「保育の必要性の認定」などの要件があります。スクールバスは別途実費です。ご家庭が対象かどうかは、見学・体験の際にお気軽にご相談ください。</p>
    <a class="btn btn-primary btn-block" href="{{sheetHref}}" data-close><span data-en="See tuition &amp; subsidy">授業料と無償化を見る</span></a>
    <button type="button" class="btn btn-ghost btn-block" id="ast-close"><span data-en="Close">閉じる</span></button>
  </dialog>
