<!-- LIGHTBOX -->
  <dialog class="lightbox" id="lightbox" aria-label="写真" data-en-aria-label="Photo viewer">
    <button type="button" class="icon-btn lb-close" id="lb-close" aria-label="閉じる" data-en-aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    <figure class="lb-figure">
      <img id="lb-img" alt="" width="1000" height="600">
      <figcaption><strong id="lb-title"></strong><span id="lb-desc"></span></figcaption>
    </figure>
    <div class="lb-nav">
      <button type="button" class="icon-btn" id="lb-prev" aria-label="前の写真" data-en-aria-label="Previous photo"><svg class="icon" aria-hidden="true"><use href="#i-chev-left"/></svg></button>
      <span class="lb-count" id="lb-count" aria-live="polite"></span>
      <button type="button" class="icon-btn" id="lb-next" aria-label="次の写真" data-en-aria-label="Next photo"><svg class="icon" aria-hidden="true"><use href="#i-chev-right"/></svg></button>
    </div>
  </dialog>
