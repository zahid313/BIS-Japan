<!DOCTYPE html>
<html lang="ja" data-ph="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- PROTOTYPE: light-theme mobile-first redesign (docs/12-redesign-roadmap.md). Not for indexing. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <!-- Light-only design: stops Android "force dark" / dark-mode extensions from inverting the page. -->
  <meta name="color-scheme" content="light">
  <title data-en="{{titleEn}}">{{title}}</title>
  <meta name="description" content="{{description}}">
  <!-- Icons: .ico for old browsers/crawlers, PNG 48 for search results, SVG for modern browsers, 180px touch icon for iPhone home screens -->
  <link rel="icon" href="favicon.ico" sizes="32x32 48x48">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="images/crest.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Share preview (LINE, Facebook, X, Slack read these). Absolute URLs are required by the platforms;
       they assume the production domain. Re-generate images/og-image.jpg from the real hero photo once it exists. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BIS Japan">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:url" content="{{ogUrl}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:image" content="https://bisjapan.org/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ogAlt}}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- LAUNCH CHECKLIST: when this page becomes the real home page, remove the noindex tag above and enable the two items below.
       (Kept as a comment so the prototype is not indexed with a canonical pointing at the live domain.)
  <link rel="canonical" href="{{ogUrl}}">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"School","name":"British International School, Japan","alternateName":"BIS Japan","url":"https://bisjapan.org/","logo":"https://bisjapan.org/images/crest.svg","image":"https://bisjapan.org/images/og-image.jpg","telephone":"+81-46-259-9108","foundingDate":"2007","address":{"@type":"PostalAddress","postalCode":"243-0417","addressCountry":"JP","addressRegion":"神奈川県","addressLocality":"海老名市","streetAddress":"本郷4786"}}
  </script>
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Body text uses the phone's own Japanese font (Hiragino / Noto CJK / Yu Gothic): 0 bytes. Only the serif HEADLINE face is a web font, subset to the characters the headlines use (via Google Fonts text=). Production: self-host a proper subset. -->
  <link rel="stylesheet" media="print" onload="this.media='all'" href="{{fontsUrl}}">
  <noscript><link rel="stylesheet" href="{{fontsUrl}}"></noscript>
{{headExtra}}  <link rel="stylesheet" href="css/v2.css?v={{cssV}}">
</head>
<body>
